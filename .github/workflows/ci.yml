name: Verify ReleaseGuard

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm qa
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: releaseguard-qa-evidence
          path: |
            qa-artifacts/
            docs/preview.png
            docs/mobile-preview.png
          retention-days: 7
